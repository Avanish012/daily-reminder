name: Daily Briefing Automation

on:
  schedule:
    # यह UTC टाइम है (02:30 UTC = 08:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # मैन्युअल टेस्ट करने के लिए

jobs:
  run-agent:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Code CheckOut
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Agent Script
        run: python daily_agent.py
